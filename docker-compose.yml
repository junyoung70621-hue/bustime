name: myapp

services:
  web:
    build: .
    container_name: myapp
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/app
      FILES_ROOT: /app/data/files
    ports:
      - "${WEB_PORT:-8090}:3000"
    volumes:
      - data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: myapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 넣으세요}
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z  # z: SELinux 서버에서도 읽히게
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 20
    # 포트는 외부에 열지 않는다(도커 내부망에서 web 만 접속)

volumes:
  data:
  pgdata:
