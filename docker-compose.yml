name: myapp

services:
  web:
    build: .
    container_name: myapp
    restart: unless-stopped
    logging: # 컨테이너 로그가 끝없이 쌓이지 않게(10MB × 3개까지만)
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    env_file: .env
    environment:
      TZ: Asia/Seoul
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/app
      FILES_ROOT: /app/data/files
    ports:
      - "${WEB_PORT:-8090}:3000"
    volumes:
      - data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    # alpine 판은 CentOS 7(커널 3.10)에서 initdb 파일 쓰기가 막힘(Operation not permitted) → 데비안 판 사용
    image: postgres:17
    container_name: myapp-db
    restart: unless-stopped
    logging: # 컨테이너 로그가 끝없이 쌓이지 않게(10MB × 3개까지만)
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 넣으세요}
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z  # z: SELinux 서버에서도 읽히게
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 20
    # 포트는 외부에 열지 않는다(도커 내부망에서 web 만 접속)

volumes:
  data:
  pgdata:
