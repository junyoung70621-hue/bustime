name: myapp

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: myapp
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
    ports:
      - "${WEB_PORT:-8090}:3000"
    volumes:
      - data:/app/data

volumes:
  data:
